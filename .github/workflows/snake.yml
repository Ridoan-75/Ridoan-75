name: Generate Contribution Snake

on:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/snake.yml'
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Ridoan-75
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=d946ef&color_dots=%23fdf4ff,%23f5d0fe,%23e879f9,%23c026d3,%2386198f
            dist/github-contribution-grid-snake-dark.svg?color_snake=d946ef&color_dots=%23fdf4ff,%23f5d0fe,%23e879f9,%23c026d3,%2386198f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}