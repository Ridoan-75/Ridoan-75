name: Update GitHub README Stats

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Update README with stats
        run: node scripts/update-stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_USERNAME: Ridoan-75

      - name: Commit and push changes
        run: |
          git fetch origin main
          
          if git diff --name-only | grep -q README.md; then
            echo "📝 Changes detected"
            
            git stash || true
            git reset --hard origin/main
            node scripts/update-stats.js
            
            git add README.md
            git commit -m "chore: update stats [skip ci]" || echo "No changes"
            git push origin main --force-with-lease
            
            echo "✅ Successfully updated"
          else
            echo "ℹ️ No changes needed"
          fi
