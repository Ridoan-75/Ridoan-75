<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#0f0a1a"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="250" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.3" opacity="0.08"/>
  </pattern>
  <rect width="1280" height="250" fill="url(#grid)"/>

  <!-- Center glow arc -->
  <circle cx="640" cy="125" r="120" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Main center text -->
  <text x="640" y="100" text-anchor="middle" fill="url(#textGlow)" font-family="'Courier New', monospace" font-size="42" font-weight="bold" filter="url(#glow)" letter-spacing="5">THANKS FOR VISITING!</text>

  <!-- Subtitle -->
  <text x="640" y="135" text-anchor="middle" fill="#a78bfa" font-family="'Courier New', monospace" font-size="15" font-weight="400" letter-spacing="2">Let's build something amazing together.</text>

  <!-- Social icons row -->
  <g transform="translate(640, 175)">
    <!-- GitHub icon -->
    <g transform="translate(-80, -8)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
      <path d="M -4 -2 L -4 -6 L -2 -6 L -2 -2 Z M -6 -2 L -6 -4 L -4 -4 L -4 -2 Z M 4 -2 L 4 -6 L 2 -6 L 2 -2 Z M 2 -2 L 2 -4 L 4 -4 L 4 -2 Z" fill="#8b5cf6" opacity="0.8"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- LinkedIn icon -->
    <g transform="translate(0, -8)">
      <rect x="-10" y="-10" width="20" height="20" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
      <text x="0" y="3" text-anchor="middle" fill="#8b5cf6" font-family="'Courier New', monospace" font-size="10" font-weight="bold">in</text>
    </g>

    <!-- Email icon -->
    <g transform="translate(80, -8)">
      <rect x="-12" y="-8" width="24" height="16" rx="2" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.8"/>
      <path d="M -10 -6 L 0 2 L 10 -6" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>

  <!-- Bottom left geometric decoration -->
  <g opacity="0.35">
    <path d="M 0 250 L 0 170 L 50 170" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M 0 250 L 0 200 L 30 200" fill="none" stroke="#d946ef" stroke-width="1"/>
    <line x1="10" y1="250" x2="10" y2="180" stroke="#8b5cf6" stroke-width="0.5" opacity="0.5"/>
    <line x1="20" y1="250" x2="20" y2="190" stroke="#d946ef" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Bottom right geometric decoration -->
  <g opacity="0.35">
    <path d="M 1280 250 L 1280 170 L 1230 170" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M 1280 250 L 1280 200 L 1250 200" fill="none" stroke="#d946ef" stroke-width="1"/>
    <line x1="1270" y1="250" x2="1270" y2="180" stroke="#8b5cf6" stroke-width="0.5" opacity="0.5"/>
    <line x1="1260" y1="250" x2="1260" y2="190" stroke="#d946ef" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Top accent line -->
  <line x1="0" y1="1" x2="1280" y2="1" stroke="url(#arc)" stroke-width="1" opacity="0.2"/>
</svg>