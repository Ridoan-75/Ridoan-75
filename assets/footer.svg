<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Let's build something useful</title>
  <desc id="desc">A closing banner inviting collaboration with Md Ridoan.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#1d292d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d6c4"/>
      <stop offset="1" stop-color="#ff8b6a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8d7d1" stroke-width="0.6" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="220" fill="url(#background)"/>
  <rect width="1280" height="220" fill="url(#grid)"/>
  <path d="M0 1h1280" stroke="url(#accent)" stroke-width="2"/>
  <g transform="translate(96 66)">
    <text fill="#a6c2c0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">OPEN TO GOOD IDEAS</text>
    <text y="48" fill="#f4f7f5" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700">Let's build something useful.</text>
    <text y="82" fill="#c0d1d0" font-family="Arial, Helvetica, sans-serif" font-size="16">Thanks for stopping by. Reach out and let's make it real.</text>
  </g>
  <g transform="translate(1064 90)">
    <circle cx="24" cy="24" r="24" fill="#15252d" stroke="#56d6c4" stroke-width="2"/>
    <path d="M14 24h19M26 17l7 7-7 7" fill="none" stroke="#56d6c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M96 174h1088" stroke="#b8d7d1" stroke-width="1" opacity="0.2"/>
</svg>