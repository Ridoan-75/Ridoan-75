<text x="550" y="122" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800">Thanks for visiting.</text>
<text x="550" y="153" text-anchor="middle" fill="#a8bfdf" font-family="Arial,Helvetica,sans-serif" font-size="16">Have a product idea? Let's build something useful.</text>
<path d="M100 184H1000" stroke="#26394f" stroke-width="2"/><path d="M100 184H1000" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="38 210" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-496" dur="4.2s" repeatCount="indefinite"/></path>
