<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Md Ridoan Hossen contact footer</title>
<desc id="desc">Contact links and a closing message for Md Ridoan Hossen's portfolio.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141a"/><stop offset=".55" stop-color="#0d2024"/><stop offset="1" stop-color="#17231f"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65f6d0"/><stop offset=".52" stop-color="#d9f36b"/><stop offset="1" stop-color="#ff8066"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65f6d0" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".7"/><stop offset="1" stop-color="#ff8066" stop-opacity="0"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7cebd0" opacity=".12"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/><rect width="1200" height="300" rx="18" fill="url(#grid)"/><path d="M0 300L325 0H490L165 300Z" fill="#65f6d0" opacity=".05"/><path d="M1050 0H1200V145L1015 300H850Z" fill="#ff8066" opacity=".07"/>
<g><rect x="-240" y="20" width="210" height="38" fill="url(#beam)" opacity=".4" transform="skewX(-22)"><animate attributeName="x" values="-240;1230" dur="4.6s" repeatCount="indefinite"/></rect></g>
<text x="600" y="63" text-anchor="middle" fill="#9bcac0" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="5">LET'S CONNECT / OPEN CHANNEL</text>
<text x="600" y="120" text-anchor="middle" fill="#f6fff9" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="52" font-weight="800">Thanks for visiting.<animate attributeName="fill" values="#f6fff9;#d9f36b;#f6fff9" dur="5s" repeatCount="indefinite"/></text>
<text x="600" y="151" text-anchor="middle" fill="#b8d4cc" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="19">Have a product idea? Let's build something useful.</text>
<path d="M82 174H1118" stroke="#355057" stroke-width="3"/><path d="M82 174H1118" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="44 210" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-508" dur="4s" repeatCount="indefinite"/></path><circle r="8" fill="#ff8066" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M82 174H1118"/><animate attributeName="r" values="5;11;5" dur="1.2s" repeatCount="indefinite"/></circle>
<g font-family="Trebuchet MS,Segoe UI,sans-serif" text-anchor="middle"><path d="M300 219H900" stroke="#426269" stroke-width="2" stroke-dasharray="8 14"/><circle cx="300" cy="219" r="12" fill="#11282a" stroke="#65f6d0" stroke-width="2"><animate attributeName="r" values="9;14;9" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="600" cy="219" r="12" fill="#1d2b20" stroke="#d9f36b" stroke-width="2"><animate attributeName="r" values="9;14;9" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle><circle cx="900" cy="219" r="12" fill="#2d211f" stroke="#ff8066" stroke-width="2"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle><circle r="5" fill="#ffffff" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M300 219H900"/></circle><text x="300" y="247" fill="#65f6d0" font-size="14" font-weight="700" letter-spacing="2">BUILD</text><text x="600" y="247" fill="#d9f36b" font-size="14" font-weight="700" letter-spacing="2">SHIP</text><text x="900" y="247" fill="#ff8066" font-size="14" font-weight="700" letter-spacing="2">CONNECT</text></g>
<path d="M82 266H1118" stroke="#355057" stroke-width="2"/><path d="M82 266H1118" stroke="url(#accent)" stroke-width="3" stroke-dasharray="28 190" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-436" dur="3.6s" repeatCount="indefinite"/></path>
</svg>
