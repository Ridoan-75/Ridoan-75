<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Md Ridoan Hossen contact footer</title>
<desc id="desc">Contact links and a closing message for Md Ridoan Hossen's portfolio.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d16"/><stop offset="1" stop-color="#101b2b"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00d9ff"/><stop offset=".5" stop-color="#735cff"/><stop offset="1" stop-color="#f449c3"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1c5681" opacity=".2"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="320" rx="14" fill="url(#bg)"/><rect width="1100" height="320" rx="14" fill="url(#grid)"/>
