<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 350" width="1280" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#0f0a1a"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="350" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.3" opacity="0.1"/>
  </pattern>
  <rect width="1280" height="350" fill="url(#grid)"/>

  <!-- Large glowing arc behind avatar -->
  <circle cx="640" cy="110" r="200" fill="none" stroke="url(#arc)" stroke-width="2" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="640" cy="110" r="170" fill="none" stroke="url(#arc)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="640" cy="110" r="140" fill="none" stroke="url(#arc)" stroke-width="1" opacity="0.15"/>

  <!-- Avatar placeholder -->
  <circle cx="640" cy="100" r="55" fill="#12101a" stroke="url(#arc)" stroke-width="3"/>
  <circle cx="640" cy="100" r="55" fill="none" stroke="#d946ef" stroke-width="1" opacity="0.3"/>
  <text x="640" y="108" text-anchor="middle" fill="#e879f9" font-family="'Courier New', monospace" font-size="26" font-weight="bold" letter-spacing="2">MR</text>

  <!-- Main title -->
  <text x="640" y="215" text-anchor="middle" fill="url(#textGlow)" font-family="'Courier New', monospace" font-size="52" font-weight="bold" filter="url(#glow)" letter-spacing="6">HELLO WORLD</text>

  <!-- Subtitle -->
  <text x="640" y="250" text-anchor="middle" fill="#a78bfa" font-family="'Courier New', monospace" font-size="16" font-weight="500" letter-spacing="8">WELCOME TO MY PROFILE</text>

  <!-- Left side: GitHub -->
  <g transform="translate(40, 310)">
    <path d="M 0 8 L 0 0 L 8 0 L 8 8 Z M 2 2 L 2 6 L 6 6 L 6 2 Z" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
    <circle cx="4" cy="4" r="3" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
    <text x="18" y="6" fill="#8b5cf6" font-family="'Courier New', monospace" font-size="13" font-weight="500">github.com/Ridoan-75</text>
  </g>

  <!-- Right side: Email -->
  <g transform="translate(1240, 310)">
    <rect x="-60" y="0" width="60" height="14" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.8"/>
    <path d="M -52 4 L -36 4 L -44 10 L -44 4 Z M -52 10 L -36 10 L -44 4 L -44 10 Z" fill="none" stroke="#d946ef" stroke-width="1" opacity="0.8"/>
    <text x="-62" y="6" text-anchor="end" fill="#d946ef" font-family="'Courier New', monospace" font-size="13" font-weight="500">ridoan437@gmail.com</text>
  </g>

  <!-- Bottom left geometric decoration -->
  <g opacity="0.4">
    <path d="M 0 350 L 0 260 L 50 260" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M 0 350 L 0 290 L 30 290" fill="none" stroke="#d946ef" stroke-width="1"/>
    <line x1="10" y1="350" x2="10" y2="270" stroke="#8b5cf6" stroke-width="0.5" opacity="0.5"/>
    <line x1="20" y1="350" x2="20" y2="280" stroke="#d946ef" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Bottom right geometric decoration -->
  <g opacity="0.4">
    <path d="M 1280 350 L 1280 260 L 1230 260" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M 1280 350 L 1280 290 L 1250 290" fill="none" stroke="#d946ef" stroke-width="1"/>
    <line x1="1270" y1="350" x2="1270" y2="270" stroke="#8b5cf6" stroke-width="0.5" opacity="0.5"/>
    <line x1="1260" y1="350" x2="1260" y2="280" stroke="#d946ef" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Top subtle accent lines -->
  <line x1="0" y1="1" x2="1280" y2="1" stroke="url(#arc)" stroke-width="1" opacity="0.3"/>
</svg>