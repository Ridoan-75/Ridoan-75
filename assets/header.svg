<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Md Ridoan Hossen portfolio header</title>
<desc id="desc">Animated portfolio header for Md Ridoan Hossen, a Full Stack Developer.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141a"/><stop offset=".55" stop-color="#0d2024"/><stop offset="1" stop-color="#17231f"/></linearGradient>
<linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65f6d0"/><stop offset=".52" stop-color="#d9f36b"/><stop offset="1" stop-color="#ff8066"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7cebd0" opacity=".12"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65f6d0" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".7"/><stop offset="1" stop-color="#ff8066" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/><rect width="1200" height="300" rx="18" fill="url(#grid)"/>
<g clip-path="url(#frame)"><path d="M-40 272L260 0H450L145 300Z" fill="#65f6d0" opacity=".05"/><path d="M1035 0H1240L930 300H770Z" fill="#ff8066" opacity=".07"/><path d="M42 38H306M894 38H1158" stroke="#37565a" stroke-width="2"/><path d="M42 38H306M894 38H1158" stroke="url(#signal)" stroke-width="5" stroke-dasharray="26 170" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-392" dur="3.2s" repeatCount="indefinite"/></path><rect x="-260" y="18" width="220" height="42" fill="url(#beam)" opacity=".45" transform="skewX(-22)"><animate attributeName="x" values="-260;1240" dur="4.8s" repeatCount="indefinite"/></rect>
<circle cx="64" cy="38" r="5" fill="#65f6d0"><animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/></circle><circle cx="1136" cy="38" r="5" fill="#ff8066"><animate attributeName="r" values="4;10;4" dur="2s" begin=".7s" repeatCount="indefinite"/></circle></g>
<text x="600" y="92" text-anchor="middle" fill="#9bcac0" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="5">MD RIDOAN HOSSEN / 2026</text>
<text x="600" y="157" text-anchor="middle" fill="#f6fff9" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="56" font-weight="800">Full Stack Developer<animate attributeName="fill" values="#f6fff9;#d9f36b;#f6fff9" dur="5s" repeatCount="indefinite"/></text>
<text x="600" y="188" text-anchor="middle" fill="#b8d4cc" font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="18">I turn complex ideas into calm, useful digital products.</text>
<path d="M92 222H1108" stroke="#355057" stroke-width="3"/><path d="M92 222H1108" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" stroke-dasharray="46 220" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-532" dur="4.2s" repeatCount="indefinite"/></path>
<circle r="7" fill="#d9f36b" filter="url(#glow)"><animateMotion dur="3.4s" repeatCount="indefinite" path="M92 222H1108"/><animate attributeName="r" values="4;9;4" dur="1.3s" repeatCount="indefinite"/></circle>
<g font-family="Trebuchet MS,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><rect x="196" y="245" width="220" height="38" rx="8" fill="#11282a" stroke="#65f6d0"/><text x="306" y="269" fill="#65f6d0">INTERFACES</text><rect x="490" y="245" width="220" height="38" rx="8" fill="#1d2b20" stroke="#d9f36b"/><text x="600" y="269" fill="#d9f36b">SYSTEMS</text><rect x="784" y="245" width="220" height="38" rx="8" fill="#2d211f" stroke="#ff8066"/><text x="894" y="269" fill="#ff8066">DELIVERY</text></g>
</svg>
