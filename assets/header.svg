      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.58" stop-color="#172a32"/>
      <stop offset="1" stop-color="#0d151b"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d6c4" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#56d6c4" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8b6a" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
