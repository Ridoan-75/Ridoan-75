<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" width="1280" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Md Ridoan - Full Stack Developer</title>
  <desc id="desc">A professional profile header for Md Ridoan, a full stack developer.</desc>
  <defs>
