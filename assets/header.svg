<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Md Ridoan Hossen portfolio header</title>
<desc id="desc">Animated portfolio header for Md Ridoan Hossen, a Full Stack Developer.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d16"/><stop offset="1" stop-color="#101b2b"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00d9ff"/><stop offset=".5" stop-color="#735cff"/><stop offset="1" stop-color="#f449c3"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1c5681" opacity=".23"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="360" rx="14" fill="url(#bg)"/><rect width="1100" height="360" rx="14" fill="url(#grid)"/>
<path d="M40 42H360M740 42H1060" stroke="#26394f" stroke-width="7"/><path d="M40 42H360M740 42H1060" stroke="url(#accent)" stroke-width="4" stroke-dasharray="34 180" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-428" dur="3.6s" repeatCount="indefinite"/></path>
<text x="550" y="112" text-anchor="middle" fill="#8fa9cc" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" letter-spacing="4">MD RIDOAN HOSSEN</text>
<text x="550" y="174" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800">Full Stack Developer<animate attributeName="opacity" values=".78;1;.78" dur="3s" repeatCount="indefinite"/></text>
<text x="550" y="207" text-anchor="middle" fill="#a8bfdf" font-family="Arial,Helvetica,sans-serif" font-size="16">Building reliable products with thoughtful interfaces.</text>
<path d="M120 252H980" stroke="#26394f" stroke-width="2"/><path d="M120 252H980" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="42 240" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-564" dur="4.8s" repeatCount="indefinite"/></path>
<circle r="6" fill="#00d9ff" filter="url(#glow)"><animateMotion dur="3.8s" repeatCount="indefinite" path="M120 252H980"/><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/></circle>
<g font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" text-anchor="middle"><rect x="220" y="286" width="190" height="36" rx="18" fill="#0d1a30" stroke="#00d9ff"/><text x="315" y="309" fill="#00d9ff">INTERFACES</text><rect x="455" y="286" width="190" height="36" rx="18" fill="#0d1a30" stroke="#735cff"/><text x="550" y="309" fill="#a99dff">SYSTEMS</text><rect x="690" y="286" width="190" height="36" rx="18" fill="#0d1a30" stroke="#f449c3"/><text x="785" y="309" fill="#f449c3">DELIVERY</text></g>
</svg>
